[project]
name = "chess3d"
version = "0.1.0"
description = "Orchestration software for a large robotic chess set"
requires-python = ">=3.10"
dependencies = ["chess>=1.10", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
